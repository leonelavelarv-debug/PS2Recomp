# Ajustes de PS2Recomp para la RG35XX H. Edita y guarda; se aplican al abrir el juego.

# Escalado de la imagen en la pantalla de 640x480:
#   fit      mantiene la proporción (recomendado)
#   stretch  llena toda la pantalla
#   integer  solo escalas enteras (más nítido, puede dejar bordes)
PS2X_SCALE=fit

# Filtro de la imagen: nearest (nítido) o linear (suavizado)
PS2X_FILTER=nearest

# 1 = intercambia X<->O y Cuadrado<->Triángulo
# (úsalo si los botones del juego salen al revés en tu firmware)
PS2X_SWAP_FACE=0
